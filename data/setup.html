//-------Alarm-------//
async function set_alarm(submit) {
  const server = "/alarmsetup?ASound=" + encodeURIComponent(val_sw('ASound')) +
                 "&asound=" + encodeURIComponent(val('asound')) +
                 "&AHood=" + encodeURIComponent(val_sw('AHood')) +
                 "&ahood=" + encodeURIComponent(val('ahood'));
                //  "&SHood=" + encodeURIComponent(document.getElementById('SHood').value);
  try {
    await fetch(server, { method: 'GET' }); // или 'POST', если нужно
     alert("Ok");  // окно с подтверждением
  } catch (error) {
    console.error('Ошибка при отправке запроса:', error);
  }
}

//-------Arrow-------//
async function set_arrow(submit) {
  const server = "/arrowsetup?ARROW0=" + encodeURIComponent(val_sw('ARROW0')) +
                 "&ARROW1=" + encodeURIComponent(val_sw('ARROW1')) +
                 "&ARROW2=" + encodeURIComponent(val_sw('ARROW2')) +
                 "&ARROW3=" + encodeURIComponent(val_sw('ARROW3')) +
                 "&arrow0=" + encodeURIComponent(val('arrow0')) +
                 "&arrow1=" + encodeURIComponent(val('arrow1')) +
                 "&arrow2=" + encodeURIComponent(val('arrow2')) +
                 "&arrow3=" + encodeURIComponent(val('arrow3'));
  try {
    await fetch(server, { method: 'GET' }); // или 'POST', если нужно
   // alert("Ok");  //окно с подтверждением
  } catch (error) {
    console.error('Ошибка при отправке запроса:', error);
  }
}


// Основная асинхронная функция для установки цвета и яркости
async function set_color(submit) {
  const server = "/setColor?" +
                 "AddrLED=" + encodeURIComponent(val_sw('AddrLED')) +
                 "&ColorLED=" + encodeURIComponent(val('ColorLED')) +
                 "&Brightness=" + encodeURIComponent(document.getElementById('Brightness').value);
  try {
    await fetch(server, { method: 'GET' }); // или 'POST', если нужно
   alert("Ok");  //окно с подтверждением
  } catch (error) {
    console.error('Ошибка при отправке запроса:', error);
  }
}


//------weather------//
  async function set_weather() {
    const location = document.getElementById('location').value;
   const apikey = document.getElementById('apiKey').value;

    const server = "/setweather?" +
                   "location=" + encodeURIComponent(location) +
                   "&apikey=" + encodeURIComponent(apikey);
  try {
    await fetch(server, { method: 'POST' }); // или 'GET', если нужно
    alert("Ok");
  } catch (error) {
    console.error('Ошибка при отправке запроса:', error);
  }
}

//--------NTP--------//
async function set_time_zone(submit) {
  const server = "/TimeZone?timezone=" + encodeURIComponent(val('timezone'));
  try {
    await fetch(server, { method: 'GET' }); // или 'POST', если нужно
   // alert("Ok");
  } catch (error) {
    console.error('Ошибка при отправке запроса:', error);
  }
}

async function set_ntp(submit) {
  const server = "/Ntpserver?ntpserver=" + encodeURIComponent(val('ntpserver'));
  try {
    await fetch(server, { method: 'GET' }); // или 'POST', если нужно
    alert("Ok");
  } catch (error) {
    console.error('Ошибка при отправке запроса:', error);
  }
}
